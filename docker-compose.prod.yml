x-api: &api
  image: soe-api:${SOE_IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: infra/api/Dockerfile
  env_file: .env
  environment: &api-environment
    SOE_ENV: ${SOE_ENV:-production}
    SOE_DEMO_MODE: ${SOE_DEMO_MODE:-false}
    SOE_DATABASE_URL: ${SOE_DATABASE_URL:?Set SOE_DATABASE_URL to a PostgreSQL psycopg URL}
    SOE_SESSION_SECRET: ${SOE_SESSION_SECRET:?Set SOE_SESSION_SECRET}
    SOE_REDIS_URL: ${SOE_REDIS_URL:-redis://redis:6379/0}
    SOE_MEDIA_ROOT: /app/media
    SOE_RUN_MIGRATIONS: ${SOE_RUN_MIGRATIONS:-false}
    PORT: "8000"
  volumes:
    - soe-media:/app/media
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - soe-db:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  migrate:
    <<: *api
    command: ["true"]
    environment:
      <<: *api-environment
      SOE_RUN_MIGRATIONS: "true"
    restart: "no"
  api:
    <<: *api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${SOE_BIND_ADDRESS:-127.0.0.1}:${SOE_API_PORT:-8000}:8000"
  worker:
    <<: *api
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *api-environment
      SOE_RUN_MIGRATIONS: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib, time; p = pathlib.Path('/tmp/soe-worker-heartbeat'); assert p.exists() and time.time() - p.stat().st_mtime < 60"]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 3
  frontend:
    image: soe-frontend:${SOE_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: infra/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL to the browser-visible API origin}
    environment:
      PORT: "3000"
    restart: unless-stopped
    ports:
      - "${SOE_BIND_ADDRESS:-127.0.0.1}:${SOE_FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  soe-db:
  soe-media:
