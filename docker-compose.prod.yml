x-api: &api
  image: soe-api:${SOE_IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: infra/api/Dockerfile
  env_file:
    - path: ${SOE_ENV_FILE:-.env}
      required: false
  environment: &api-environment
    SOE_ENV: ${SOE_ENV:-production}
    SOE_DEMO_MODE: ${SOE_DEMO_MODE:-false}
    SOE_DATABASE_URL: ${SOE_DATABASE_URL:?Set SOE_DATABASE_URL to a PostgreSQL psycopg URL}
    SOE_SESSION_SECRET: ${SOE_SESSION_SECRET:?Set SOE_SESSION_SECRET}
    SOE_REDIS_URL: ${SOE_REDIS_URL:-redis://redis:6379/0}
    SOE_TRUSTED_PROXIES: ${SOE_TRUSTED_PROXIES:-172.30.0.2/32}
    SOE_CORS_ORIGINS: ${SOE_CORS_ORIGINS:-https://${SOE_DOMAIN}}
    SOE_MEDIA_ROOT: /app/media
    SOE_WHISPER_CACHE_DIR: /app/.cache/whisper
    SOE_RUN_MIGRATIONS: ${SOE_RUN_MIGRATIONS:-false}
    PORT: "8000"
  volumes:
    - soe-media:/app/media
    - soe-whisper:/app/.cache/whisper
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - soe-db:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  migrate:
    <<: *api
    command: ["true"]
    environment:
      <<: *api-environment
      SOE_RUN_MIGRATIONS: "true"
    restart: "no"
  api:
    <<: *api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *api-environment
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    tmpfs:
      - /tmp/prometheus:uid=10001,gid=10001,mode=0700
  worker:
    <<: *api
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *api-environment
      SOE_RUN_MIGRATIONS: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib, time; p = pathlib.Path('/tmp/soe-worker-heartbeat'); assert p.exists() and time.time() - p.stat().st_mtime < 60"]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 3
  frontend:
    image: soe-frontend:${SOE_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: infra/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://${SOE_DOMAIN}}
    environment:
      PORT: "3000"
    restart: unless-stopped

    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    environment:
      SOE_DOMAIN: ${SOE_DOMAIN:?Set SOE_DOMAIN}
      SOE_ACME_EMAIL: ${SOE_ACME_EMAIL:?Set SOE_ACME_EMAIL}
      SOE_MAX_UPLOAD_BYTES: ${SOE_MAX_UPLOAD_BYTES:-2000000000}
    ports:
      - "${SOE_PUBLIC_BIND:-0.0.0.0}:80:80"
      - "${SOE_PUBLIC_BIND:-0.0.0.0}:443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        ipv4_address: 172.30.0.2
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
  backup:
    image: soe-backup:${SOE_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: infra/backup/Dockerfile
    profiles: [backup]
    env_file:
      - path: ${SOE_ENV_FILE:-.env}
        required: false
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - ${SOE_BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy
    # Exit nonzero on failure; the host must alert/restart after investigation.
    restart: "no"

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  caddy_data:
  caddy_config:
  soe-db:
  soe-media:
  soe-whisper:
