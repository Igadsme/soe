[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soe"
version = "0.1.0"
description = "Autonomous AI content intelligence, clipping, publishing, and monetization platform"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest-cov>=6,<8",
  "ruff>=0.14,<1",
  "pip-audit>=2.9,<3",
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
  "httpx==0.28.1",
]

# pytest configuration lives in pytest.ini (it takes precedence over this file).

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
